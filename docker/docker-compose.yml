services:
  # Owns the Matter fabric: commissions nodes, keeps CASE sessions and
  # attribute subscriptions alive, and exposes them over a WebSocket API.
  # Host networking is mandatory - Matter needs IPv6 and mDNS on the LAN to
  # reach the sensors through the Thread border router.
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./matter-server-data:/data
      # BlueZ, only needed to commission a factory-fresh sensor from this host.
      # Joining an already-commissioned sensor as a second admin happens over
      # the network and needs neither of these.
      # - /run/dbus:/run/dbus:ro
    command: --storage-path /data --paa-root-cert-dir /data/credentials
    # Append to the command above to enable BLE commissioning: --bluetooth-adapter 0
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # One bridge serves every sensor on the fabric - they all live behind the
  # same Matter server - so unlike the old BLE client there is no container
  # per sensor. Sensors are told apart by the "sensor" metric label.
  aqs_matter_client:
    image: aqs_matter_client:latest
    container_name: aqs_matter_client
    restart: always
    network_mode: host
    build: .
    depends_on:
      - matter-server
    environment:
      - MATTER_SERVER_URL=ws://localhost:5580/ws
      # Optional. Without it each sensor is named from its Matter NodeLabel,
      # falling back to ProductName, then node_<id>.
      - NODE_NAMES=1:air_quality_sensor_001,2:air_quality_sensor_002
      - BROKER=192.168.0.1                           # MQTT broker, leave empty to disable MQTT
      - PORT=1883                                    # MQTT broker port
      - USERNAME=admin                               # MQTT username
      - PASSWORD=1234                                # MQTT password
      - PROMETHEUS_PORT=8000                         # Prometheus metrics port
    volumes:
      - ../scripts:/app  # Mount Python code to container
    logging:
      options:
        max-size: "10m"
        max-file: "3"
