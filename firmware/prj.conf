# Stacks
CONFIG_MAIN_STACK_SIZE=8192

# --- Matter over Thread (see src/matter/) ---
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/matter/chip_project_config.h"
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/matter/default_zap/aqs.zap"
# Example/placeholder Product ID, see:
# https://github.com/project-chip/connectedhomeip/blob/master/docs/examples/discussion/PID_allocation_for_example_apps.md
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# Add support for LEDs and buttons on Nordic development kits
# Switch LEDS on
CONFIG_DK_LIBRARY=y
CONFIG_NCS_SAMPLE_MATTER_LEDS=y

# Enable Matter pairing (BLE commissioning window) automatically on startup.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Factory data / OTA left disabled for this first bring-up task - uses
# Matter's compiled-in test onboarding codes/certificates instead.
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_SHELL=n

# Persistent Subscriptions
CONFIG_CHIP_PERSISTENT_SUBSCRIPTIONS=y

# Force MTD + Nordic's prebuilt OpenThread library: the Kconfig choice
# defaults in Kconfig alone don't reliably resolve (OPENTHREAD_LIBRARY_AVAILABLE
# depends circularly on OPENTHREAD_NORDIC_LIBRARY_MTD), leaving OpenThread built
# from source with no Nordic radio library - causing slow/unstable Thread
# join and commissioning failures.
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=y

# Intermittently Connected Device tuning. Disabled: this build is USB powered,
# so trading reachability for sleep current buys nothing, and a 5 minute poll
# interval put the device out of reach between polls. Enabling it again also
# requires the IcdManagement cluster on endpoint 0, which the ZAP does not
# currently provide, and a fast polling interval shorter than the active mode
# duration. Keep this for a future battery powered build.
# CONFIG_CHIP_ENABLE_ICD_SUPPORT=y
# CONFIG_CHIP_ICD_LIT_SUPPORT=y
# CONFIG_CHIP_ICD_IDLE_MODE_DURATION=900
# CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=300000
# CONFIG_CHIP_ICD_ACTIVE_MODE_DURATION=500
# CONFIG_CHIP_ICD_ACTIVE_MODE_THRESHOLD=10000
# CONFIG_CHIP_ICD_FAST_POLLING_INTERVAL=1000
# CONFIG_CHIP_ICD_CLIENTS_PER_FABRIC=2

# No bootloader for this first bring-up task: MCUboot's dual-slot DFU support
# doesn't fit this board's flash budget alongside Matter+Thread+BLE (see
# git history for the partition-manager investigation). Without it, this is a
# single monolithic image again, just like the original BLE-only firmware -
# which also means the existing Adafruit UF2 bootloader is left untouched.
# Revisit once a real OTA/DFU mechanism is needed.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_CHIP_BOOTLOADER_MCUBOOT=n
CONFIG_CHIP_BOOTLOADER_NONE=y

# Link-Time Optimization: meaningfully reduces flash usage by eliminating
# dead code more aggressively across translation units.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Flash
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Settings
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# Peripherals and drivers
CONFIG_GPIO=y       # Required to control LED
CONFIG_I2C=y        # Required for sensors
CONFIG_SENSOR=y     # Required for sensors

# Device drivers
# SHT4X, SGP40, SCD4X and BMP388 (which also covers bosch,bmp390) all default to
# y when a matching devicetree node is enabled, so they need no entry here.
# BME68X_IAQ is the exception: it is the licensed BSEC path, has no devicetree
# default, and is mutually exclusive with the plain BME680 driver - which does
# default from devicetree, so it has to be turned off explicitly.
CONFIG_BME680=n
CONFIG_BME68X_IAQ=y

# Low power
CONFIG_PM_DEVICE=y

# Logging over the USB CDC ACM console. The board selects
# BOARD_SERIAL_BACKEND_CDC_ACM by default, which already turns on SERIAL,
# CONSOLE, UART_CONSOLE, USB_DEVICE_STACK_NEXT and CDC_ACM_SERIAL_INITIALIZE_AT_BOOT,
# and delays log processing at startup so early output survives enumeration.
# Nothing USB related belongs here - the board does it.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Application Configuration
# Timing Configuration
CONFIG_ADVERTISEMENT_INTERVAL=5000
CONFIG_MEASUREMENTS_PER_INTERVAL=1

# Peripheral Configuration
# The sensor symbols now default to y for every part present in the board
# overlay, so they only need an entry here to turn one off. Flash is very tight
# (see the memory report after a build), so enable them one at a time.
CONFIG_ENABLE_EVENT_LED=n
CONFIG_ENABLE_SHT4X=n
CONFIG_ENABLE_SGP40=n
CONFIG_ENABLE_SCD4X=n
CONFIG_ENABLE_BMP390=n
CONFIG_ENABLE_BME680=n

# SCD4X Sensor Configuration
CONFIG_SCD4X_ALTITUDE=10
CONFIG_SCD4X_TEMPERATURE_OFFSET=0

