# Variant: Bosch IAQ (BME680).
#
# Build together with variants/aqs_003.overlay, which selects the sensors.
#
# This variant needs the licensed BSEC library. It has no devicetree default and
# is mutually exclusive with the plain BME680 driver, which does default from the
# devicetree - so both symbols have to be set explicitly here. Fetch the sources
# first:
#
#   west config manifest.group-filter -- +bsec
#   west update bme68x bsec

CONFIG_CHIP_DEVICE_PRODUCT_NAME="Air Quality Sensor IAQ"

CONFIG_BME680=n
CONFIG_BME68X_IAQ=y
