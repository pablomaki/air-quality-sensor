# Variant: temperature, humidity and CO2 (SHT41 + SCD41).
#
# Build together with variants/aqs_001.overlay, which is what selects the
# sensors: each CONFIG_ENABLE_<sensor> depends on its devicetree node and
# defaults to y, so enabling the node is all that is needed.
#
# This file carries only what the devicetree cannot express.

CONFIG_CHIP_DEVICE_PRODUCT_NAME="Air Quality Sensor TH-CO2"

# Metres above sea level, used for CO2 compensation when no pressure sensor is
# fitted to supply it.
CONFIG_SCD4X_ALTITUDE=10
CONFIG_SCD4X_TEMPERATURE_OFFSET_MILLI_C=2300
