# Variant: CO2 plus Bosch IAQ (SCD41 + BME680).
#
# Build together with variants/aqs_004.overlay, which selects the sensors.
#
# Needs the licensed BSEC library, so the bsec west manifest group has to be
# enabled first:
#
#   west config manifest.group-filter -- +bsec
#   west update bme68x bsec

CONFIG_CHIP_DEVICE_PRODUCT_NAME="Air Quality Sensor CO2-IAQ"

CONFIG_SCD4X_ALTITUDE=10
CONFIG_SCD4X_TEMPERATURE_OFFSET_MILLI_C=500

CONFIG_BME680=n
CONFIG_BME68X_IAQ=y
