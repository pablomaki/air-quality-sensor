# Variant: VOC only (SGP40).
#
# Build together with variants/aqs_002.overlay, which selects the sensors.

CONFIG_CHIP_DEVICE_PRODUCT_NAME="Air Quality Sensor VOC"

# The Sensirion gas index algorithm is specified for 1 s sampling and tested to
# 10 s, so keep the sampling interval short here even though reporting is slow.
CONFIG_SAMPLE_INTERVAL_MS=5000
CONFIG_REPORT_INTERVAL_MS=60000
