# dts/bindings/sensor/sensirion,scd4x.yaml
description: Sensirion SCD4x CO₂ sensor

# Note: intentionally not "sensirion,scd41" - that compatible is now also
# defined by mainline Zephyr's own upstream binding, and this project uses
# its own custom driver/binding (src/drivers/scd4x.c), so a distinct name
# avoids a devicetree binding collision when building against mainline Zephyr.
compatible: "sensirion,scd4x"

include: [sensor-device.yaml, i2c-device.yaml]

properties:
  mode:
    type: int
    required: true
    description: |
      - 0: Normal periodic measurement. Default interval of 5sec
      - 1: Low power periodic measurement. Interval of 30sec
      - 2: Singleshot measurement for low power usage.
      - 3: Singleshot measurement with power cycling (only beneficial with intervals of greater than 380sec).
    enum:
      - 0
      - 1
      - 2 
      - 3
  enable-selftest:
    type: boolean
    description: |
      Enabling this will run a selftest when the driver initializes.
      The selftest takes ~10s.