# Minimal I2C bus probe. No Matter, no Thread, no BLE - just the bus, so that a
# failure here can only be the board, the wiring or the SDK, never the
# application. The XIAO BLE board devicetree already enables i2c1 on P0.04/P0.05
# and routes the console to USB CDC ACM, so no overlay is needed.
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
